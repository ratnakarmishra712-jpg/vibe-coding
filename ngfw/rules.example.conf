# Example policy for the ngfw learning firewall.
# Format:  action  direction  proto  src   dst   dport  state  [host]
# Rules are read top-to-bottom; the FIRST match wins. Anything that matches no
# rule hits the engine's default policy (deny). The 8th 'host' field is optional
# and enables NGFW app-aware rules (matches TLS SNI / HTTP Host / DNS name).

# 0. NGFW app-ID: block tracker/ad domains by name, even though the ports below
#    would otherwise allow them. Put these BEFORE the general allow-out rule.
deny    out   tcp    any   any   443   any   *.doubleclick.net
deny    out   tcp    any   any   80    any   *.doubleclick.net
deny    out   udp    any   any   53    any   *.doubleclick.net

# 1. Let OUR host start connections to anywhere (any state, any host).
allow   out   any    any   any   any   any

# 2. Let the return traffic of flows we started back IN automatically.
#    This is the heart of a stateful firewall.
allow   in    any    any   any   any   established

# 3. Explicitly allow strangers to open SSH to us (a 'new' inbound hole).
allow   in    tcp    any   any   22    new

# 4. Allow inbound DNS replies on UDP (belt-and-braces; usually 'established').
allow   in    udp    any   any   53    any

# 5. Catch-all: block everything else arriving from outside, including
#    out-of-state ('invalid') packets.
deny    in    any    any   any   any   any
